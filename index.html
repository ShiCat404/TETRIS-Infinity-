<html lang="ja">
<head>
<meta charset="utf-8">

<title>落ち続けるテトリス</title>
<style>

*{

  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-user-drag:none;
  -webkit-text-size-adjust:100%;
}
html,body{
  touch-action:none;
  overscroll-behavior:none;
  overflow:hidden;
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
body{
  position:fixed;
  width:100%;
  height:100%;
  -webkit-text-size-adjust:100%;
}
canvas{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;
}
main{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}

.hud{font-size:14px;color:var(--mut)}
.hud b{color:var(--fg);font-size:20px;font-variant-numeric:tabular-nums}
canvas{background:var(--well);border:2px solid var(--line);border-radius:4px;display:block}
.hint{max-width:420px;font-size:12px;color:var(--mut);text-align:center}
button{font:inherit;font-size:20px;padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--fg)}
button:active{background:var(--line)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="hud">スコア <b id="sc">0</b> <span id="snd" style="margin-left:10px;font-size:12px">🔇 タップで音ON</span></div>
<canvas id="c"></canvas>
<div class="hint">横スワイプで移動 / タップで回転 / 0.5秒長押しで加速</div>
</main>

  const block = e => e.preventDefault();

  // 長押しのコンテキストメニュー、文字選択、ドラッグを無効化
  ["contextmenu","selectstart","dragstart"].forEach(type=>{
    document.addEventListener(type, block, {passive:false});
  });

  // Safariのピンチズーム等のジェスチャーイベントを無効化
  ["gesturestart","gesturechange","gestureend"].forEach(type=>{
    document.addEventListener(type, block, {passive:false});
  });

  // ダブルタップによるズームを抑止（ゲーム操作側のpointer系イベントは維持）
  let lastTap = 0;
  document.addEventListener("touchend", e=>{
    const now = performance.now();
    if(now - lastTap < 350) e.preventDefault();
    lastTap = now;
  }, {passive:false});

  // iOS Safariでのスクロール/バウンスを抑止
  document.addEventListener("touchmove", e=>{
    e.preventDefault();
  }, {passive:false});

  // ホイール系のスクロールも念のため抑止
  document.addEventListener("wheel", block, {passive:false});

  for(const y of flash){const gx=(-.3+1.6*sw)*cell*W,gr=g.createLinearGradient(gx-cell*3,0,gx+cell*3,0);
   gr.addColorStop(0,"rgba(255,244,214,0)");gr.addColorStop(.5,"rgba(255,244,214,.5)");gr.addColorStop(1,"rgba(255,244,214,0)");
   g.fillStyle="rgba(255,255,255,"+(.07+.12*k)+")";g.fillRect(0,Y(y),cell*W,cell);
   g.fillStyle=gr;g.fillRect(0,Y(y),cell*W,cell);
   g.strokeStyle="rgba(240,208,120,"+(.45+.4*k)+")";g.lineWidth=1.5;g.strokeRect(1,Y(y)+1,cell*W-2,cell-2)}}
 if(labels.length){labels=labels.filter(o=>o.l<1.2);g.textAlign="center";g.textBaseline="middle";g.font="bold "+Math.round(cell*1.2)+"px sans-serif";g.lineJoin="round";
  for(const o of labels){o.l+=dt/1000;const t=o.l-o.i*.09;if(t<0)continue;
   const x=Math.min(1,t/.22)-1,sc=1+2.70158*x*x*x+1.70158*x*x,al=Math.min(1,Math.max(0,(1.1-t)/.35)),
    yy=Math.max(cell,Math.min(cell*VR-cell,Y(o.y)+cell/2-o.i*cell*1.5-cell*.8*Math.min(1,t)));
   g.save();g.globalAlpha=al;g.translate(cell*W/2,yy);g.scale(sc,sc);g.shadowColor=o.col;g.shadowBlur=cell*.7;
   g.lineWidth=4;g.strokeStyle="#0c0f15";g.strokeText(o.t,0,0);g.fillStyle=o.col;g.fillText(o.t,0,0);g.restore()}}
 if(bot<0.5){g.fillStyle=css.getPropertyValue("--fg");g.fillRect(0,Y(0)+cell-2,cell*W,3)}
}
function loop(t){const dt=Math.min(100,t-last);last=t;
 spd+=((soft?V1:V0)-spd)*(1-Math.exp(-dt/1000*7));
 if(phase==="play"&&p){if(hit(p.m,p.x,p.y-1)){acc=0;lt+=dt/1000;if(lt>=(soft?.12:.45)){lt=0;lock()}}
  else{lt=0;acc+=spd*dt/1000;while(acc>=1&&p){acc-=1;if(hit(p.m,p.x,p.y-1)){acc=0;break}p.y--}}}
 else if(phase==="flash"){ft+=dt/1000;if(ft>=.55)collapse()}
 else if(phase==="fall"){anim.t+=dt/1000;if(anim.t>=anim.T){anim=null;check()}}
 draw(dt);requestAnimationFrame(loop)}
const act={L:()=>move(-1),R:()=>move(1),ROT:rot,HD:hard};
addEventListener("keydown",e=>{const k={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"ROT"," ":"HD"}[e.key];
 if(k){e.preventDefault();act[k]()}if(e.key==="ArrowDown"){e.preventDefault();soft=true}});
addEventListener("keyup",e=>{if(e.key==="ArrowDown")soft=false});
let G=null;
addEventListener("pointerdown",e=>{clearTimeout(G&&G.h);G={x:e.clientX,y:e.clientY,sx:e.clientX,t:performance.now(),moved:false};
 G.h=setTimeout(()=>{if(G&&!G.moved)soft=true},500)});
addEventListener("pointermove",e=>{if(!G)return;
 if(Math.abs(e.clientX-G.x)>12||Math.abs(e.clientY-G.y)>12)G.moved=true;
 while(e.clientX-G.sx>=cell){G.sx+=cell;move(1)}
 while(G.sx-e.clientX>=cell){G.sx-=cell;move(-1)}});
function end(){if(!G)return;clearTimeout(G.h);if(!G.moved&&!soft&&performance.now()-G.t<300)rot();soft=false;G=null}
addEventListener("pointerup",end);addEventListener("pointercancel",end);
spawn();cam=p.y+4;requestAnimationFrame(t=>{last=t;loop(t)});
</script>
