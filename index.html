<style>
:root{box-sizing:border-box;--bg:#f2efe9;--fg:#1d2430;--well:#e4e0d8;--line:#c9c3b6;--btn:#fff;--mut:#6b7280;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--fg:#e8ecf3;--well:#1a2030;--line:#2b3347;--btn:#1f2638;--mut:#8b95a8}}
:root[data-theme="dark"]{--bg:#10141c;--fg:#e8ecf3;--well:#1a2030;--line:#2b3347;--btn:#1f2638;--mut:#8b95a8}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-user-drag:none;
  -webkit-text-size-adjust:100%;
}
html,body{
  touch-action:none;
  overscroll-behavior:none;
  overflow:hidden;
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
body{
  position:fixed;
  width:100%;
  height:100%;
  -webkit-text-size-adjust:100%;
}
canvas{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;
}
main{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}

.hud{font-size:14px;color:var(--mut)}
.hud b{color:var(--fg);font-size:20px;font-variant-numeric:tabular-nums}
canvas{background:var(--well);border:2px solid var(--line);border-radius:4px;display:block}
.hint{max-width:420px;font-size:12px;color:var(--mut);text-align:center}
button{font:inherit;font-size:20px;padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--fg)}
button:active{background:var(--line)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#soundBtn{font-size:16px;font-weight:700;padding:10px 18px;min-height:44px;touch-action:manipulation}
#soundBtn[data-on="1"]{opacity:.8}
</style>
</head>

<script>
/* iOS/Safari: ゲーム中のブラウザUIジェスチャーを極力抑止 */
(()=>{
  const block = e => e.preventDefault();

  // 長押しのコンテキストメニュー、文字選択、ドラッグを無効化
  ["contextmenu","selectstart","dragstart"].forEach(type=>{
    document.addEventListener(type, block, {passive:false});
  });

  // Safariのピンチズーム等のジェスチャーイベントを無効化
  ["gesturestart","gesturechange","gestureend"].forEach(type=>{
    document.addEventListener(type, block, {passive:false});
  });

  // ダブルタップによるズームを抑止（ゲーム操作側のpointer系イベントは維持）
  let lastTap = 0;
  document.addEventListener("touchend", e=>{
    const now = performance.now();
    if(now - lastTap < 350) e.preventDefault();
    lastTap = now;
  }, {passive:false});

  // iOS Safariでのスクロール/バウンスを抑止
  document.addEventListener("touchmove", e=>{
    e.preventDefault();
  }, {passive:false});

  // ホイール系のスクロールも念のため抑止
  document.addEventListener("wheel", block, {passive:false});
})();
